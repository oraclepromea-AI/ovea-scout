<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ovea Scout — Dashboard</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: system-ui, -apple-system, sans-serif; max-width: 1200px; margin: 0 auto; padding: 1rem; background: #0b0b0f; color: #e8e8ed; line-height: 1.5; }
    h1 { font-size: 1.8rem; margin-bottom: 0.25rem; }
    .muted { color: #888; font-size: 0.9rem; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1rem; margin-top: 1rem; }
    .card { background: #14141c; border: 1px solid #2a2a35; border-radius: 8px; padding: 1rem; }
    .card h3 { margin: 0 0 0.75rem; font-size: 1rem; color: #a8a8b8; }
    .stat { font-size: 1.6rem; font-weight: 600; color: #fff; }
    .task-form { display: flex; gap: 0.5rem; margin-bottom: 1rem; flex-wrap: wrap; }
    .task-form input { flex: 1; min-width: 200px; padding: 0.5rem; background: #14141c; border: 1px solid #2a2a35; border-radius: 4px; color: #e8e8ed; }
    .task-form button { padding: 0.5rem 1rem; background: #3a5bff; border: none; border-radius: 4px; color: #fff; cursor: pointer; }
    .task-form button:disabled { opacity: 0.5; cursor: not-allowed; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 0.5rem; text-align: left; border-bottom: 1px solid #2a2a35; font-size: 0.85rem; }
    th { color: #a8a8b8; font-weight: 500; }
    tr:hover { background: #1a1a22; }
    .status-ok { color: #4ade80; }
    .status-fail { color: #f87171; }
    .status-pending { color: #fbbf24; }
    .json { background: #0d0d12; padding: 0.5rem; border-radius: 4px; font-family: monospace; font-size: 0.75rem; max-height: 300px; overflow: auto; white-space: pre-wrap; word-break: break-word; }
    .badge { display: inline-block; padding: 0.1rem 0.4rem; border-radius: 3px; font-size: 0.7rem; background: #2a2a35; }
    .loading { opacity: 0.6; }
  </style>
</head>
<body>
  <header>
    <h1>Ovea Scout</h1>
    <p class="muted">Autonomous AI-Agent Economy on Sui — Microtask Marketplace</p>
  </header>

  <div class="task-form">
    <input id="prompt" placeholder="Enter task, e.g. 'Query SUI balance for 0xabc...'" />
    <input id="budget" type="number" step="0.001" value="0.05" placeholder="Budget (USDC)" style="width: 100px;" />
    <button id="submit">Submit Task</button>
  </div>

  <div class="grid">
    <div class="card">
      <h3>Agents</h3>
      <div id="agents" class="json">Loading…</div>
    </div>
    <div class="card">
      <h3>Latest Job</h3>
      <div id="latest" class="json">—</div>
    </div>
    <div class="card">
      <h3>Settlement</h3>
      <div id="settlement" class="json">—</div>
    </div>
    <div class="card">
      <h3>Ledger (last 10)</h3>
      <div id="ledger" class="json">Loading…</div>
    </div>
  </div>

  <script>
    const API = "http://localhost:8080";
    async function fetchJSON(url) { const r = await fetch(url); return r.json(); }

    async function loadAll() {
      try {
        const [agents, ledger] = await Promise.all([fetchJSON(API + "/agents"), fetchJSON(API + "/ledger?limit=10")]);
        document.getElementById("agents").textContent = JSON.stringify(agents, null, 2);
        document.getElementById("ledger").textContent = JSON.stringify(ledger.slice(-10).reverse(), null, 2);
        if (ledger.length) {
          document.getElementById("latest").textContent = JSON.stringify(ledger[ledger.length - 1], null, 2);
          const settled = ledger.find(e => e.event === "settled" || e.event === "verified" || e.event === "rejected");
          if (settled) document.getElementById("settlement").textContent = JSON.stringify(settled, null, 2);
        }
      } catch (e) {
        document.getElementById("agents").textContent = "Error: " + e.message;
      }
    }

    document.getElementById("submit").addEventListener("click", async () => {
      const prompt = document.getElementById("prompt").value.trim();
      const budget = parseFloat(document.getElementById("budget").value) || 0.05;
      if (!prompt) return alert("Enter a prompt");
      const btn = document.getElementById("submit");
      btn.disabled = true; btn.textContent = "Running…";
      try {
        const r = await fetch(API + "/tasks", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ prompt, budgetUsdc: budget }) });
        const out = await r.json();
        alert(JSON.stringify(out, null, 2));
        loadAll();
      } catch (e) { alert("Error: " + e.message); }
      finally { btn.disabled = false; btn.textContent = "Submit Task"; }
    });

    loadAll();
    setInterval(loadAll, 5000);
  </script>
</body>
</html>
